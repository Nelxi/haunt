[package]
name = "haunt"
version = "0.1.0"
description = "A fast, beautiful SSH client written in Rust"
license = "MIT"
repository = "https://github.com/Nelxi/haunt"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false }
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
env_logger = "0.11.11"
keyring = "4.2.0"
log = "0.4.35"
parking_lot = "0.13.0"
raw-window-handle = "0.6"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-perl"] }
rfd = "0.18.0"
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa", "flate2"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "net", "macros", "fs"] }
toml = "1.2.1"
uuid = { version = "1.29.1", features = ["v4", "serde"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_SystemInformation"] }
winreg = "0.56.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
